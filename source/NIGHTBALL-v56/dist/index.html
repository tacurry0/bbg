<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="wordmark" id="brand" aria-label="ホーム">NIGHTBALL<span class="brand-dot"></span><svg class="broadcast-brand-ball" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.7" fill="#eff9ff" stroke="#8fc4f4"/><path fill="none" stroke="#da4650" stroke-width="1.5" d="M5.8 4.6a10.5 10.5 0 0 1 0 16.8M20.2 4.6a10.5 10.5 0 0 0 0 16.8"/></svg></button>
    <div class="top-actions"><button class="icon-button" id="sound" aria-label="サウンドを切り替え"></button><button class="icon-button" id="pause" aria-label="一時停止" hidden></button><button class="icon-button react-button" id="react" aria-label="リアクション" hidden>😊</button><button class="icon-button sub-button" id="sub" aria-label="選手交代" hidden>交代</button><button class="icon-button" id="settings" aria-label="設定"></button></div>
  </header>
  <div class="react-panel" id="react-panel" hidden></div>

  <main id="home" class="home-screen">
    <section class="menu-hero" aria-label="NIGHTBALL メインメニュー">
      <img class="menu-key-art" src="./assets/menu/clubhouse-v18.webp" width="1774" height="887" alt="黄色いユニフォームの打者と、えんじ色の投手が立つナイターの球場" fetchpriority="high" decoding="async">
      <div class="menu-hero-shade"></div><h1>メインメニュー</h1>
    </section>
    <div class="menu-content">
      <button id="resume-game" class="menu-resume" hidden><span class="resume-play" aria-hidden="true">▶</span><span><b>つづきから</b><small id="resume-label"></small></span><span class="menu-chevron" aria-hidden="true">↗</span></button>
      <nav class="menu-modes" aria-label="ゲームモード">
        <button id="pennant-mode" class="menu-card menu-season" aria-label="ペナント">
          <span class="menu-season-copy"><small class="menu-mode-tag">CPBL / NPB / KBO</small><strong>ペナント</strong><span class="menu-club-logos" id="menu-club-logos" aria-hidden="true"></span></span>
          <img class="menu-trophy" src="./assets/menu/trophy.svg" width="210" height="200" alt="" aria-hidden="true"><span class="menu-chevron" aria-hidden="true">↗</span>
        </button>
        <button class="menu-card menu-match" data-mode="match" aria-label="5イニング対戦">
          <span class="menu-match-copy"><small class="menu-mode-tag">5イニング</small><strong>対戦</strong></span><span class="menu-matchup" id="menu-matchup" aria-hidden="true"></span><span id="match-icon" hidden></span><span class="menu-chevron" aria-hidden="true">↗</span>
        </button>
        <button class="menu-card menu-apbc" data-mode="apbc" aria-label="APBC 2026"><span class="menu-match-copy"><small class="menu-mode-tag">2026 代表大会</small><strong>APBC</strong></span><span class="apbc-menu-badges" aria-hidden="true"><img src="./assets/nations/taipei.svg" alt=""><img src="./assets/nations/korea.svg" alt=""><img src="./assets/nations/japan.svg" alt=""></span><span class="menu-chevron" aria-hidden="true">↗</span></button>
        <button class="menu-card menu-career" data-mode="career"><span><small class="menu-mode-tag">高校からプロへ</small><strong>選手キャリア</strong></span><span class="menu-chevron" aria-hidden="true">↗</span></button>
        <div class="menu-training">
          <button class="menu-mini menu-derby" data-mode="derby" aria-label="ホームランダービー"><span class="menu-mini-art"><i class="mode-icon" id="derby-icon" aria-hidden="true"></i><i class="menu-spark" aria-hidden="true"></i></span><strong>HR競争</strong></button>
          <button class="menu-mini menu-batting" data-mode="practice" aria-label="打撃練習"><span class="menu-mini-art"><i class="mode-icon" id="practice-icon" aria-hidden="true"></i></span><strong>打撃練習</strong></button>
          <button class="menu-mini menu-pitch" data-mode="pitching" aria-label="投球練習"><span class="menu-mini-art"><i class="mode-icon" id="pitching-icon" aria-hidden="true"></i></span><strong>投球練習</strong></button>
          <button class="menu-mini menu-tournament" data-mode="tournament" aria-label="勝ち抜きトーナメント"><span class="menu-mini-art"><i class="mode-icon" aria-hidden="true">♜</i></span><strong>トーナメント</strong></button>
          <button class="menu-mini menu-online" data-mode="online" aria-label="オンライン対戦"><span class="menu-mini-art"><i class="mode-icon" aria-hidden="true">⇄</i></span><strong>オンライン対戦</strong></button>
          <button class="menu-mini menu-umpire" data-mode="umpire" aria-label="審判モード"><span class="menu-mini-art"><i class="mode-icon" aria-hidden="true">⚖</i></span><strong>審判</strong></button>
        </div>
      </nav>
      <nav class="menu-utilities" aria-label="選手・記録・遊び方">
        <button id="clubhouse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-1 3-7 3-8 0Z"/><path d="M12 6v15m-3-6h1m4 0h1"/></svg><span>選手</span></button>
        <button id="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v6c0 6-10 6-10 0V3Zm0 2H3v3c0 3 2 4 5 4m9-7h4v3c0 3-2 4-5 4m-4 2v5m-4 2h8"/></svg><span>記録</span><small><b id="home-best">0</b>m</small></button>
        <button id="howto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v1"/></svg><span>遊び方</span></button>
      </nav>
    </div>
  </main>

  <main id="pennant" class="pennant-screen" hidden></main>

  <main id="apbc-cup" class="pennant-screen apbc-cup-screen" hidden></main>

  <main id="career" class="career-screen" hidden></main>

  <main id="game" class="game-screen" hidden>

    <div class="game-topline"><div id="inning-label">1回ウラ</div><div id="count" class="count"></div><div class="base-display" id="bases" aria-label="走者なし"><i></i><i></i><i></i></div></div>
    <div class="game-stage" id="stage"><div class="scoreboard" id="scoreboard"></div><canvas id="game-canvas" tabindex="0" aria-label="押したまま狙い、離すとスイングまたは投球"></canvas><div id="rain-overlay" class="rain-overlay" hidden></div><div id="hr-celebration" class="hr-celebration" hidden aria-hidden="true"><i class="hr-fw f1"></i><i class="hr-fw f2"></i><i class="hr-fw f3"></i><strong>ホームラン！</strong><span id="hr-distance"></span></div>
      <button id="player-card" type="button" class="hud-player-card hud-batter" aria-label="打者の能力を見る"></button>
      <button id="pitcher-card" type="button" class="hud-player-card hud-pitcher" aria-label="投手の能力を見る"></button>
      <div class="pitch-meta-hud">
        <div id="abs-count" class="abs-count" hidden><span>ABS</span><b id="abs-remaining">2</b></div>
        <div id="wind-hud" class="wind-hud"><i aria-hidden="true">⬆</i><b id="wind-speed">0</b><span>m</span></div>
      </div>
      <div class="role-tag" id="role-tag">BATTING</div><button id="bench-button" class="bench-chip" aria-label="選手交代・ベンチ" hidden>ベンチ</button><button id="ibb" class="bench-chip" aria-label="申告敬遠" hidden>申告敬遠</button><button id="field-speed" class="speed-chip" aria-label="打球後の速度を切り替え" aria-pressed="false">打球後 ×1</button><button id="auto-defense" class="auto-defense-chip" aria-pressed="false" hidden>守備を自動で進行</button><button id="running-mode" class="running-mode-chip" aria-pressed="false" hidden>走塁：自動</button><div class="pitch-info"><span id="pitch-label">READY</span><span class="pitch-speed-line"><b id="pitch-speed">—</b><small>km/h</small></span><span id="pitch-detail" class="pitch-detail"></span></div>
      <div id="atbat-chart" class="atbat-chart" hidden><div class="atbat-chart-head">この打席の配球</div><svg id="atbat-chart-svg" viewBox="0 0 84 64" aria-hidden="true"></svg><div id="atbat-chart-seq" class="atbat-chart-seq"></div></div>
      <div class="react-pop" id="react-pop" aria-hidden="true"></div><div id="chat-pop" class="chat-pop" role="status" hidden></div><div class="stage-message" id="stage-message" aria-live="polite" aria-atomic="true">
        <div class="stage-call"><div class="stage-call-head"><span id="message-en"></span></div>
          <div class="stage-call-detail"><strong id="message-ja"></strong><small id="message-sub"></small></div>
        </div>
      </div>

      <div class="batting-actions" id="bat-options"><div class="bat-style"><button id="contact" class="selected"><i class="bat-action-icon" data-bat-icon="contact" aria-hidden="true"></i><span>ミート</span></button><button id="power"><i class="bat-action-icon" data-bat-icon="power" aria-hidden="true"></i><span>強振</span></button><button id="bunt" aria-pressed="false"><i class="bat-action-icon" data-bat-icon="bunt" aria-hidden="true"></i><span>バント</span></button><button id="steal" aria-pressed="false" hidden><i class="bat-action-icon" data-bat-icon="steal" aria-hidden="true"></i><span>盗塁</span></button></div></div>
      <div id="pitch-deck" class="pitch-deck" hidden><div class="pitch-deck-label"><span>球種を選択</span><span id="pitch-deck-status">コースを狙って離す</span></div><div class="pitch-types" id="pitch-types"></div></div>
      <div id="thumb-hint" class="thumb-hint"><span>押す</span><i>↗</i><span>狙う</span><i>↗</i><b id="release-label">離して打つ</b></div>

      <div id="runner-map" class="runner-map" role="group" aria-label="走者の位置とスワイプ操作" hidden></div>

      <section id="half-break" class="half-break" role="dialog" aria-modal="true" aria-labelledby="half-break-title" hidden><div class="half-break-card"><h2 id="half-break-title"></h2><div id="half-break-score"></div><strong id="half-break-next"></strong><small id="half-auto-note"></small><button id="half-continue" type="button">タップして次の回へ</button></div></section>
      <section id="career-field-overlay" class="career-field-overlay" aria-label="選手キャリアの試合情報" hidden></section>
      <div id="run-actions" class="run-actions" hidden><button id="run-advance" type="button">次の塁へ</button><button id="run-return" type="button">帰塁</button></div>
      <div id="play-tools" class="play-tools" hidden><output id="hit-readout"></output></div>
      <div id="scoring-chip" class="scoring-chip" role="status" aria-atomic="true" hidden></div>
      <div id="umpire-call" class="umpire-call" role="status" hidden></div>
      <button id="abs-actor" type="button" hidden></button>
      <button id="play-challenge" class="play-challenge" type="button" hidden>チャレンジ</button>
      <button id="abs-challenge" class="abs-challenge" type="button" hidden><span id="abs-challenge-label">ABSチャレンジ</span><span class="abs-challenge-timer" aria-hidden="true"><i id="abs-challenge-fill"></i></span></button>
      <div id="umpire-panel" class="umpire-panel" hidden>
        <div class="umpire-status"><span>審判スコア <b id="umpire-score">0</b></span><span>投球正解率 <b id="umpire-accuracy">—</b></span><span id="umpire-play-wrap" hidden>塁上 <b id="umpire-play-accuracy">—</b></span></div>
        <div id="umpire-feedback" class="umpire-feedback" role="status" hidden></div>
        <div id="umpire-pitch-buttons" class="umpire-buttons" hidden><span class="umpire-prompt">判定は？</span><button id="umpire-ball" type="button">ボール</button><button id="umpire-strike" type="button">ストライク</button></div>
        <div id="umpire-play-buttons" class="umpire-buttons" hidden><span class="umpire-prompt" id="umpire-play-prompt">接戦プレー、判定は？</span><button id="umpire-safe" type="button">セーフ</button><button id="umpire-out" type="button">アウト</button></div>
      </div>
      <section id="abs-review" class="abs-review" role="region" aria-label="ABSチャレンジ" hidden>
        <canvas id="abs-canvas" aria-hidden="true"></canvas>
        <div class="abs-ident"><strong>NIGHTBALL</strong><span>ABS 挑戰系統</span><small id="abs-challenger" hidden></small></div>
        <div id="abs-splash" class="abs-splash" aria-hidden="true"><strong>ABS</strong><span>CHALLENGE</span></div>
        <div id="abs-verdict" class="abs-verdict" aria-live="polite" hidden>
          <strong id="abs-word" lang="zh-Hant"></strong><small id="abs-gap" lang="zh-Hant"></small><span id="abs-change"></span>
        </div>
      </section>
      <div id="replay-label" class="replay-label" role="status" hidden>REPLAY</div>
      <aside id="challenge-panel" class="challenge-panel" hidden><strong id="challenge-title"></strong><small id="challenge-goal"></small><button id="challenge-retry" type="button" hidden>もう一度</button></aside>
      <div class="stage-bottom"><span id="batter-label">中信兄弟</span><span id="distance"></span></div>
    </div>
    <div class="controls" hidden aria-hidden="true">
      <div class="timing-head"><span id="pitch-status">カーソルをコースへ</span><span id="timing-result">CURSOR CONTROL</span></div>


      <div class="aim-controls">
        <div class="aim-pad" id="aim-pad" role="application" aria-label="カーソル移動用の操作パッド。スライドまたは矢印キーで移動" tabindex="0"><span class="pad-gesture" aria-hidden="true">↔</span><span class="pad-main">カーソル移動</span><span class="pad-label" id="pad-label">スライドで微調整</span><i id="pad-cursor" class="pad-contact"></i></div>
        <button id="swing" class="swing-button"><span id="swing-icon"></span><span><strong id="action-label">SWING</strong><small id="action-hint">右タップで打つ</small></span></button>
      </div>
      <div class="game-tools"><button id="players-tool">選手</button><button id="tactics-tool">作戦</button><button id="history-tool">履歴</button><button id="practice-tool">練習設定</button></div>
      <div class="control-footer"><span id="difficulty-label">STANDARD</span><span id="control-hint">画面で直接狙い、離して打つこともできます</span></div>
    </div>
  </main>

  <div class="modal-backdrop" id="modal" hidden><section class="modal" id="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
  <div class="toast" id="toast" role="status"></div>
</div>
  <button id="replay-skip" class="replay-skip" aria-label="リプレイをスキップ" type="button" hidden></button>
