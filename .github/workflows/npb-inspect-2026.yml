name: Inspect NPB 2026 official table structure

on:
  push:
    branches: [main]
    paths: ['.github/workflows/npb-inspect-2026.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect official source structure
        run: |
          python - <<'PY'
          import requests,bs4,re
          urls=[
           'https://npb.jp/bis/2026/stats/idb1_g.html',
           'https://npb.jp/bis/2026/stats/idp1_g.html',
           'https://npb.jp/bis/2026/stats/idf1_g.html',
           'https://npb.jp/bis/2026/stats/idb2_a.html',
           'https://npb.jp/bis/2026/stats/idp2_v.html',
           'https://npb.jp/bis/teams/rst_g.html',
          ]
          s=requests.Session()
          s.headers['User-Agent']='NIGHTBALL-Research/1.0 (game data validation; responsible low-rate requests)'
          for url in urls:
           try:
            r=s.get(url,timeout=18);r.encoding=r.apparent_encoding
            soup=bs4.BeautifulSoup(r.text,'lxml')
            print('URL',url,'STATUS',r.status_code,'LENGTH',len(r.content),'ENC',r.encoding)
            for k,table in enumerate(soup.select('table')):
             trs=table.select('tr')
             print(' TABLE',k,'id',table.get('id'),'class',table.get('class'),'rows',len(trs))
             for tr in trs[:4]:
              cols=[re.sub(r'\\s+',' ',x.get_text(' ',strip=True))[:50] for x in tr.find_all(['th','td'])]
              print('  TR:',cols[:28])
            print(' PAGE HEADERS',[(h.name,h.get_text(' ',strip=True)[:40]) for h in soup.find_all(['h2','h3','h4'])[-12:]])
           except Exception as e: print('ERROR',url,str(e))
          PY
