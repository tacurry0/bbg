name: Smoke test NIGHTBALL in mobile Chromium

on:
  push:
    branches: [main]
    paths:
      - 'source/NIGHTBALL-v56/dist/**'
      - 'source/NIGHTBALL-v56/tests/premium-browser.mjs'
      - 'source/NIGHTBALL-v56/tests/npb-browser.mjs'
      - 'source/NIGHTBALL-v56/tests/kbo-browser.mjs'
      - 'source/NIGHTBALL-v56/tests/career-world-browser.mjs'
      - 'source/NIGHTBALL-v56/tests/abs-browser.mjs'
      - 'source/NIGHTBALL-v56/tests/verdict-vision-v220.cjs'
      - '.github/workflows/smoke-premium-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        working-directory: source/NIGHTBALL-v56
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify Stadium Vision verdict layout
        working-directory: source/NIGHTBALL-v56
        run: node tests/verdict-vision-v220.cjs --browser
      - name: Verify home player directory
        working-directory: source/NIGHTBALL-v56
        run: node tests/player-directory-v201.cjs
      - name: Run mobile ABS challenge test
        working-directory: source/NIGHTBALL-v56
        run: node tests/abs-browser.mjs
      - name: Run mobile UI + gameplay smoke test
        working-directory: source/NIGHTBALL-v56
        run: |
          node tests/career-world-browser.mjs
      - name: Verify the other game modes
        working-directory: source/NIGHTBALL-v56
        run: |
          node tests/premium-browser.mjs
          node tests/npb-browser.mjs
          node tests/kbo-browser.mjs
      - name: Keep screenshots for visual debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightball-premium-mobile-screenshots
          path: source/NIGHTBALL-v56/tests/screenshots/
          if-no-files-found: ignore
