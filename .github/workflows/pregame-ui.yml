name: Verify pregame UI
on:
  push:
    branches: [main]
    paths:
      - 'source/NIGHTBALL-v56/dist/**'
      - 'source/NIGHTBALL-v56/tests/pregame-v212.mjs'
      - 'source/NIGHTBALL-v56/tests/online-pregame-v217.cjs'
      - '.github/workflows/pregame-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pregame:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source/NIGHTBALL-v56
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install CJK fonts for screenshot inspection
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright install chromium
      - run: node tests/pregame-v212.mjs
      - run: node tests/online-pregame-v217.cjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pregame-screenshots
          path: source/NIGHTBALL-v56/tests/screenshots/pregame-*.png
          if-no-files-found: ignore
