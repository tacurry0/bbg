name: Inspect 2026 KBO English public statistics table
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbo-inspect-2026.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect one KBO team batting and pitching page
        run: |
          python - <<'PY'
          import requests,bs4,re
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 (compatible; NIGHTBALL/1.0)'
          for url in ['https://eng.koreabaseball.com/Stats/BattingByTeams.aspx','https://eng.koreabaseball.com/Stats/PitchingByTeams.aspx','https://eng.koreabaseball.com/Stats/BattingLeaders.aspx']:
           try:
            r=s.get(url,timeout=23);r.encoding=r.apparent_encoding
            so=bs4.BeautifulSoup(r.text,'lxml')
            print('URL',url,'code',r.status_code,'encoding',r.encoding,'size',len(r.content))
            print('title',so.title.get_text(' ',strip=True) if so.title else '')
            for i,t in enumerate(so.select('table')[:5]):
             rows=t.select('tr');print('TABLE',i,'id',t.get('id'),'class',t.get('class'),'rows',len(rows))
             for tr in rows[:3]:
              print('ROW', [c.get_text(' ',strip=True)[:70] for c in tr.find_all(['th','td'])][:27])
            print('FORMS',[(f.get('id'),f.get('action'),f.get('method')) for f in so.select('form')[:3]])
            print('SELECTS',[(x.get('id'),x.get('name'),[(y.get('value'),y.get_text(' ',strip=True)) for y in x.select('option')[:15]]) for x in so.select('select')[:20]])
            print('TEAM_NODES',[(x.name,x.get('id'),x.get('href'),x.get('onclick')) for x in so.find_all(['a','button','input']) if x.get_text(' ',strip=True) in ['KIA','LG','SSG','KT','NC','DOOSAN','LOTTE','KIWOOM','SAMSUNG','HANWHA']][:25])
            for match in list(re.finditer('KIA|HANWHA|Doosan|__doPostBack|TEAM_ID|ddlTeam|TEAM_CODE',r.text,re.I))[:15]:
             print('SNIP',r.text[max(match.start()-100,0):match.start()+210].replace('\\n',' '))
           except Exception as e:print('ERROR',str(e))
          PY
