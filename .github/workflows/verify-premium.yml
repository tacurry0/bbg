name: Verify NIGHTBALL graphics and baseball gameplay

on:
  push:
    branches: [main]
    paths:
      - 'source/NIGHTBALL-v56/dist/**'
      - 'source/NIGHTBALL-v56/tests/**'
      - '.github/workflows/verify-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check updated modules and entry point
        working-directory: source/NIGHTBALL-v56
        run: |
          set -euo pipefail
          node --check dist/stadium-premium.js
          node --check dist/stadium3d.js
          node --check dist/pro-parks.js
          node --check dist/pro-stadiums.js
          node --check dist/app.js
          node --check dist/pennant.js
          node --check dist/npb-postseason.js
          node --check dist/game.js
          node --check dist/abs-review.js
          for f in dist/career-world*.js; do node --check "$f"; done
          node --check dist/sw.js
          node --check dist/pwa-update.js
          node --check dist/game-lighting.js
          node --check dist/npb-data.js
          node --check dist/npb-rosters.js
          node --check dist/kbo-data.js
          node --check dist/kbo-rosters.js
          test -s dist/menu-polish.css
          grep -q 'menu-polish.css?v=58' dist/index.html
          grep -Fq 'game.js?v=129' dist/index.html
          grep -Fq 'npb-rosters.js?v=74' dist/index.html
          grep -Fq 'app.js?v=129' dist/index.html
          grep -Fq 'kbo-rosters.js?v=74' dist/index.html
          grep -q 'stadium-premium.js?v=57' dist/stadium3d.js
          grep -Fq 'stadium3d.js?v=77' dist/app.js
      - name: Test real 3D construction and player details
        working-directory: source/NIGHTBALL-v56
        run: |
          set -euo pipefail
          node tests/premium-graphics.mjs
          node tests/graphics-v56.mjs
          node tests/pwa-update.cjs
      - name: Verify unchanged match systems
        working-directory: source/NIGHTBALL-v56
        run: |
          set -euo pipefail
          node tests/pennant.cjs
          node tests/npb-postseason.cjs
          node tests/career-world.cjs
          node tests/music-v49.mjs
          node tests/rules-v16.cjs
          node tests/abs.cjs
          node tests/thumb-controls.cjs
          node tests/career-overseas-v54.mjs
          node tests/realistic-field-v58.cjs
          node tests/npb-2026.cjs
          node tests/kbo-2026.cjs
